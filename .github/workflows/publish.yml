name: publish-image

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to rebuild
        required: true
      target_environment:
        description: Image channel
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marfern2/admin-donit

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ (((github.event_name == 'workflow_dispatch') && (inputs.target_environment == 'dev')) || ((github.event_name != 'workflow_dispatch') && (github.ref_name == 'develop'))) && 'development' || 'production' }}
      url: ${{ (((github.event_name == 'workflow_dispatch') && (inputs.target_environment == 'dev')) || ((github.event_name != 'workflow_dispatch') && (github.ref_name == 'develop'))) && 'https://admin-dev.marfern.dev' || 'https://admin-donit.marfern.dev' }}
    concurrency:
      group: admin-${{ (((github.event_name == 'workflow_dispatch') && (inputs.target_environment == 'dev')) || ((github.event_name != 'workflow_dispatch') && (github.ref_name == 'develop'))) && 'development' || 'production' }}
      cancel-in-progress: ${{ ((github.event_name == 'workflow_dispatch') && (inputs.target_environment == 'dev')) || ((github.event_name != 'workflow_dispatch') && (github.ref_name == 'develop')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency security gate
        run: node scripts/audit-dependencies.mjs
      - name: Audit gate tests
        run: npm run test:audit
      - run: npm test -- --watch=false
      - run: npm run build:image
      - name: Select immutable image
        id: meta
        shell: bash
        run: |
          SHA="${{ inputs.commit_sha || github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target_environment }}"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TARGET=dev
          else
            TARGET=prod
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "immutable=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable image
        id: existing
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.immutable }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build immutable image once
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.immutable }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish branch alias and transition tag
        shell: bash
        run: |
          SOURCE="${{ steps.meta.outputs.immutable }}"
          TARGET="${{ steps.meta.outputs.target }}"
          SHORT="${{ steps.meta.outputs.short }}"

          # El tag con prefijo solo permite que el poller DEV ya instalado
          # adopte este cambio. La identidad canonica es siempre el SHA completo.
          if [ "$TARGET" = dev ]; then
            docker buildx imagetools create --tag "${IMAGE}:dev-${SHORT}" "$SOURCE"
            if [ "${{ github.event_name }}" = push ]; then
              docker buildx imagetools create --tag "${IMAGE}:develop" "$SOURCE"
            fi
          elif [ "${{ github.event_name }}" = push ]; then
            docker buildx imagetools create --tag "${IMAGE}:master" "$SOURCE"
          fi
