<mat-sidenav-container class="layout-container">
  <mat-sidenav
    #sidenavRef
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidenav() : true"
    (closedStart)="sidenav.set(false)"
    class="layout-sidenav"
  >
    <div class="sidenav-header">
      <span class="brand">Donit Admin</span>
    </div>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/users"
        routerLinkActive="active-link"
        (click)="closeSidenav()"
        aria-label="Usuarios"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Usuarios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="layout-content">
    <mat-toolbar color="primary" class="layout-toolbar">
      @if (isMobile()) {
        <button
          mat-icon-button
          (click)="toggleSidenav()"
          aria-label="Abrir menú de navegación"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">{{ pageTitle() }}</span>
      <span class="spacer"></span>
      <span class="user-info">{{ authService.currentUser()?.email }}</span>
      <button
        mat-icon-button
        (click)="authService.logout()"
        aria-label="Cerrar sesión"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
